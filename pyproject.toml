[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nirnay"
version = "0.1.0.dev0"
description = "Calibrated, cost-accounted decisions (classify / route) on the Sarvam API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "python-dotenv>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/nirnay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep hand-aligned code examples in docs as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
